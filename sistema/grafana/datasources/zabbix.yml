apiVersion: 1
datasources:
  - name: Zabbix
    type: alexanderzobnin-zabbix-datasource
    url: http://zabbix-web:8080/api_jsonrpc.php
    access: proxy
    jsonData:
      trends: true
      trendsFrom: ""
      trendsRange: ""
      cacheTTL: "1h"
      username: $ZABBIX_USER
    secureJsonData:
      password: $ZABBIX_PASSWORD
    isDefault: false
