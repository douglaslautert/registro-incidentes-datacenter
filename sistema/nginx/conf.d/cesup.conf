upstream api        { server api:8000 max_fails=3 fail_timeout=10s; keepalive 32; }
upstream keycloak   { server keycloak:8080;   keepalive 16; }
upstream grafana    { server grafana:3000;     }
upstream zabbix     { server zabbix-web:8080; }

# HTTP — sempre ativo (o install.sh usa http://localhost para configurar os serviços).
# O HTTPS da rede local fica em conf.d/cesup-ssl.conf, gerado por rede-local.sh.
server {
    listen 80;
    # Com HTTPS ativo, rede-local.sh cria redirect-https.inc: o acesso pela rede vai
    # para https. Sem o arquivo, o padrão casa com nada e o HTTP segue como está.
    include /etc/nginx/conf.d/redirect-https.inc*;
    include /etc/nginx/snippets/cesup-locations.conf;
}
