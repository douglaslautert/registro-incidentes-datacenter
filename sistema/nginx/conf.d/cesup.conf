upstream api        { server api:8000 max_fails=3 fail_timeout=10s; keepalive 32; }
upstream keycloak   { server keycloak:8080;   keepalive 16; }
upstream grafana    { server grafana:3000;     }
upstream zabbix     { server zabbix-web:8080; }

server {
    listen 80;

    # ── PWA ──────────────────────────────────────────────────
    location / {
        root /var/www/pwa;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        location ~* \.(js|css|png|svg|ico|woff2)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # ── API REST ─────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ── WebSocket ────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ── Keycloak ─────────────────────────────────────────────
    location /auth/ {
        proxy_pass         http://keycloak/auth/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
    }

    # ── Grafana ──────────────────────────────────────────────
    # serve_from_sub_path=true: o Grafana espera receber o prefixo /grafana
    location /grafana/ {
        proxy_pass http://grafana;
        proxy_set_header Host $host;
    }

    # ── Zabbix ───────────────────────────────────────────────
    location /zabbix/ {
        proxy_pass         http://zabbix/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
    }

    # ── GLPI ─────────────────────────────────────────────────
    # O GLPI gera links absolutos (/front/...) e não funciona em subcaminho;
    # ele é publicado na porta própria 8081 (ver docker-compose.yml)
    location /glpi/ {
        return 302 $scheme://$host:8081/;
    }
}
